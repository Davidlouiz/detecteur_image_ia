[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detecteur-image-ia"
version = "0.1.0"
description = "Outils experimentaux d'analyse de gradients d'images."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "Pillow",
]

[tool.setuptools.packages.find]
where = ["src"]

