<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" font-family="'Segoe UI', Arial, sans-serif">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2266cc"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#237804"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- Fond global -->
  <rect width="780" height="320" fill="#f5f7fa" rx="10"/>

  <!-- ===== PANNEAU GAUCHE : grille de pixels ===== -->
  <rect x="20" y="20" width="340" height="280" fill="white" stroke="#ddd" stroke-width="1.5" rx="6"/>
  <text x="190" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Voisinage pixel</text>

  <!-- Grille 3x3, cellule 62x62, départ (58, 60) -->
  <!-- Ligne 0 -->
  <rect x="58" y="60" width="62" height="62" fill="#ececec" stroke="#bbb"/>
  <rect x="120" y="60" width="62" height="62" fill="#ececec" stroke="#bbb"/>
  <rect x="182" y="60" width="62" height="62" fill="#ececec" stroke="#bbb"/>
  <!-- Ligne 1 -->
  <rect x="58" y="122" width="62" height="62" fill="#ececec" stroke="#bbb"/>
  <!-- g(x,y) -->
  <rect x="120" y="122" width="62" height="62" fill="#4a9eff" stroke="#2266cc" stroke-width="2.5"/>
  <!-- g(x+1,y) -->
  <rect x="182" y="122" width="62" height="62" fill="#ff8c42" stroke="#cc5500" stroke-width="2.5"/>
  <!-- Ligne 2 -->
  <rect x="58" y="184" width="62" height="62" fill="#ececec" stroke="#bbb"/>
  <!-- g(x,y+1) -->
  <rect x="120" y="184" width="62" height="62" fill="#52c41a" stroke="#237804" stroke-width="2.5"/>
  <rect x="182" y="184" width="62" height="62" fill="#ececec" stroke="#bbb"/>

  <!-- Labels pixels -->
  <text x="151" y="157" text-anchor="middle" font-size="11" fill="white" font-weight="bold">g(x, y)</text>
  <text x="213" y="153" text-anchor="middle" font-size="10.5" fill="white" font-weight="bold">g(x+1,</text>
  <text x="213" y="167" text-anchor="middle" font-size="10.5" fill="white" font-weight="bold">y)</text>
  <text x="151" y="214" text-anchor="middle" font-size="10.5" fill="white" font-weight="bold">g(x,</text>
  <text x="151" y="228" text-anchor="middle" font-size="10.5" fill="white" font-weight="bold">y+1)</text>

  <!-- Flèche vx (horizontal) -->
  <line x1="185" y1="153" x2="179" y2="153" stroke="#2266cc" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="170" y="145" text-anchor="middle" font-size="12" fill="#2266cc" font-weight="bold">vx →</text>

  <!-- Flèche vy (vertical) -->
  <line x1="151" y1="187" x2="151" y2="181" stroke="#237804" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="101" y="175" text-anchor="middle" font-size="12" fill="#237804" font-weight="bold">vy ↓</text>

  <!-- Formules -->
  <text x="190" y="265" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">vx = log₂( (g(x+1,y)+1) / (g(x,y)+1) )</text>
  <text x="190" y="284" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">vy = log₂( (g(x,y+1)+1) / (g(x,y)+1) )</text>

  <!-- ===== PANNEAU DROIT : pipeline ===== -->
  <rect x="375" y="20" width="385" height="280" fill="white" stroke="#ddd" stroke-width="1.5" rx="6"/>
  <text x="568" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Pipeline de détection</text>

  <!-- Étape 1 : Image -->
  <rect x="400" y="62" width="130" height="40" fill="#e6f0ff" stroke="#4a9eff" stroke-width="1.5" rx="5"/>
  <text x="465" y="87" text-anchor="middle" font-size="12" fill="#1a4a99">Image source</text>

  <!-- Flèche -->
  <line x1="530" y1="82" x2="545" y2="82" stroke="#555" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Étape 2 : Gris 16 bits -->
  <rect x="548" y="62" width="130" height="40" fill="#fff7e6" stroke="#ff8c42" stroke-width="1.5" rx="5"/>
  <text x="613" y="81" text-anchor="middle" font-size="11.5" fill="#7a3a00">Gris 16 bits</text>
  <text x="613" y="95" text-anchor="middle" font-size="10" fill="#7a3a00">(uint16/pixel)</text>

  <!-- Flèche vers le bas -->
  <line x1="613" y1="102" x2="613" y2="117" stroke="#555" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Étape 3 : Vecteurs de log-ratio -->
  <rect x="480" y="120" width="175" height="40" fill="#f6ffed" stroke="#52c41a" stroke-width="1.5" rx="5"/>
  <text x="568" y="139" text-anchor="middle" font-size="11.5" fill="#237804">Vecteurs de log-ratio</text>
  <text x="568" y="153" text-anchor="middle" font-size="10" fill="#237804">(vx, vy) par pixel</text>

  <!-- Flèche vers le bas -->
  <line x1="568" y1="160" x2="568" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Étape 4 : Distribution / features -->
  <rect x="453" y="178" width="230" height="50" fill="#fff0f6" stroke="#eb2f96" stroke-width="1.5" rx="5"/>
  <text x="568" y="197" text-anchor="middle" font-size="11.5" fill="#9e0059">Features statistiques</text>
  <text x="568" y="213" text-anchor="middle" font-size="10" fill="#9e0059">entropie · symétries · concentration</text>
  <text x="568" y="225" text-anchor="middle" font-size="10" fill="#9e0059">angle entropy · diversité</text>

  <!-- Flèche vers le bas -->
  <line x1="568" y1="228" x2="568" y2="243" stroke="#555" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Étape 5 : Classification -->
  <rect x="463" y="246" width="210" height="40" fill="#f0f0ff" stroke="#7c3aed" stroke-width="1.5" rx="5"/>
  <text x="568" y="265" text-anchor="middle" font-size="11.5" fill="#4c1d95">Régression logistique</text>
  <text x="568" y="279" text-anchor="middle" font-size="10" fill="#4c1d95">IA probable · Réelle probable</text>

</svg>
